[package]
name = "ontprox"
version = "0.5.2"
license = "AGPL-3.0-or-later"
authors = ["Robin Vobruba <hoijui.quaero@gmail.com>"]
description = """RDF format conversion as a web-service."""
repository = "https://codeberg.org/elevont/ontprox"
keywords = ["cli", "conversion", "ontology", "rdf", "web-service"]
categories = ["caching", "command-line-utilities", "web-programming::http-server"]
publish = true
readme = "README.md"
edition = "2024"

[lints.rust]
rust_2021_compatibility = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
wildcard_enum_match_arm = "warn"
string_slice = "warn"
indexing_slicing = "warn"
clone_on_ref_ptr = "warn"
try_err = "warn"
shadow_reuse = "warn"
empty_structs_with_brackets = "warn"
else_if_without_else = "warn"
use_debug = "warn"
print_stdout = "warn"
print_stderr = "warn"
default_trait_access = "warn"
option_if_let_else = "warn"
result_large_err = "allow"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12" }
clap = { version = "4.6", features = ["cargo", "string"] }
cli_utils = { version = "0.13", package = "cli_utils_hoijui", features = ["logging"] }
const_format = "0.2"
dirs = "6.0"
futures = "0.3"
git-version = "0.3"
mediatype = "0.20"
rdfoothills-base = { version = "0.7", features = ["url"] }
rdfoothills-conversion = { version = "0.7" }
rdfoothills-mime = { version = "0.7" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
